baseURL = "https://go-ruby-uri.github.io/"
title = "go-ruby-uri"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Parse & components"
  status = "ready"
  blurb = "`URI.parse(s)` splitting scheme / userinfo / host / port / path / query / fragment, with the per-scheme generic/HTTP/HTTPS/FTP/LDAP shapes Ruby's URI uses."
[[params.phases]]
  name = "Build & merge"
  status = "ready"
  blurb = "Constructing a URI from components and `merge` / `+` for relative-reference resolution, following RFC 3986 the way reference Ruby does."
[[params.phases]]
  name = "Normalize"
  status = "ready"
  blurb = "`normalize` lower-casing the scheme and host, collapsing default ports and dot-segments, matching MRI byte-for-byte."
[[params.phases]]
  name = "encode_www_form & escaping"
  status = "ready"
  blurb = "Form encoding/decoding and `escape`/`unescape` with Ruby's reserved-character tables."
[[params.phases]]
  name = "Error taxonomy"
  status = "ready"
  blurb = "The `URI::InvalidURIError` / `URI::InvalidComponentError` / `URI::BadURIError` hierarchy, raised on the same inputs as reference Ruby."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "A wide URI corpus parsed, built and normalized both here and by the system `ruby`/`uri`, compared byte-for-byte; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
